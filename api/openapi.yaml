openapi: 3.1.0

# The README states the API is documented and frontend independent, so the
# contract lives next to the code it describes. Point any OpenAPI tooling at this
# file (openapi-typescript, Swagger UI, Postman, ...).
info:
  title: Start & Found API
  description: |
    REST API of the startup social platform.

    Two identities can publish (see the README "Publishing Model"): a user
    (`@HanzoDev`) or one of their projects (`@HanzoDev/SonarAI`). Posts always
    reference a publisher, never a user directly.

    Authentication uses an HS256 access token (15 minutes by default) plus an
    opaque refresh token that must be sent to `/auth/refresh` and `/auth/logout`.

    Errors always use the same envelope:

    ```json
    {"error": {"code": "not_found", "message": "post not found"}}
    ```
  version: "0.1.0"
  license:
    name: TBD

servers:
  - url: http://localhost:8080/v1
    description: Local development

tags:
  - name: auth
    description: Registration, login and session rotation
  - name: users
    description: Personal profiles and the activity shown on them
  - name: projects
    description: Startup and side project identities, their teams and posts
  - name: publishers
    description: Publishing identities (a user or a project)
  - name: posts
    description: Publishing and editing content
  - name: threads
    description: Reply trees assembled from posts
  - name: media
    description: Signed uploads to object storage

paths:
  /healthz:
    get:
      tags: [auth]
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: The process is running
  /readyz:
    get:
      tags: [auth]
      summary: Readiness probe
      description: Reports the state of PostgreSQL, Redis and object storage.
      security: []
      responses:
        "200":
          description: Every required dependency is reachable
        "503":
          description: PostgreSQL is unavailable

  /auth/signup:
    post:
      tags: [auth]
      summary: Register an account
      description: Creates the account, its personal publisher and a session.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, email, display_name, password]
              properties:
                username: { type: string, example: HanzoDev }
                email: { type: string, format: email, example: hanzo@example.com }
                display_name: { type: string, example: Hanzo }
                password: { type: string, minLength: 8, example: password123 }
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Validation" }

  /auth/login:
    post:
      tags: [auth]
      summary: Start a session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier, password]
              properties:
                identifier: { type: string, description: Username or email, example: HanzoDev }
                password: { type: string, example: password123 }
      responses:
        "200":
          description: Session created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/refresh:
    post:
      tags: [auth]
      summary: Rotate a refresh token
      description: The presented token is revoked and a new session is returned.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        "200":
          description: New session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/logout:
    post:
      tags: [auth]
      summary: Revoke a session
      description: Idempotent - unknown or already revoked tokens also return 204.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        "204": { description: Session revoked }

  /feed:
    get:
      tags: [posts]
      summary: Global feed of top level posts
      security: []
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: A page of posts, newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PostPage" }

  /me:
    get:
      tags: [users]
      summary: The authenticated account
      responses:
        "200":
          description: Private profile of the caller
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      tags: [users]
      summary: Update the authenticated account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name: { type: string, maxLength: 80 }
                avatar_url: { type: string }
                bio: { type: string, maxLength: 280 }
      responses:
        "200":
          description: Updated account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "422": { $ref: "#/components/responses/Validation" }

  /me/publishers:
    get:
      tags: [publishers]
      summary: Identities the caller may publish as
      description: The personal publisher plus every project the caller owns or belongs to.
      responses:
        "200":
          description: Publishing identities
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Publisher" }

  /users/{username}:
    get:
      tags: [users]
      summary: Public profile with project showcase and activity
      security: []
      parameters:
        - { name: username, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: Profile view
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: "#/components/schemas/Profile" }
                  projects:
                    type: array
                    items: { $ref: "#/components/schemas/Project" }
                  posts: { $ref: "#/components/schemas/PostPage" }
        "404": { $ref: "#/components/responses/NotFound" }

  /users/{username}/projects:
    get:
      tags: [users]
      summary: Project showcase of a user
      security: []
      parameters:
        - { name: username, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Projects owned by the user
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Project" }

  /users/{username}/posts:
    get:
      tags: [users]
      summary: Activity of a user
      security: []
      parameters:
        - { name: username, in: path, required: true, schema: { type: string } }
        - name: scope
          in: query
          schema: { type: string, enum: [all, user, projects], default: all }
          description: all (default) also includes posts published by the user's projects
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: A page of posts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PostPage" }

  /projects:
    post:
      tags: [projects]
      summary: Create a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, slug]
              properties:
                name: { type: string, maxLength: 80 }
                slug: { type: string, description: Lowercase URL identifier, example SonarAI }
                tagline: { type: string, maxLength: 140 }
                description: { type: string }
                avatar_url: { type: string }
      responses:
        "201":
          description: Project created together with its publisher and owner membership
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectCreated" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Validation" }

  /projects/{slug}:
    get:
      tags: [projects]
      summary: Project page with its posts
      security: []
      parameters:
        - { $ref: "#/components/parameters/Slug" }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: Project view
          content:
            application/json:
              schema:
                type: object
                properties:
                  project: { $ref: "#/components/schemas/Project" }
                  posts: { $ref: "#/components/schemas/PostPage" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [projects]
      summary: Update a project
      description: Owners only.
      parameters:
        - { $ref: "#/components/parameters/Slug" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 80 }
                tagline: { type: string, maxLength: 140 }
                description: { type: string }
                avatar_url: { type: string }
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /projects/{slug}/posts:
    get:
      tags: [projects]
      summary: Posts published by the project
      security: []
      parameters:
        - { $ref: "#/components/parameters/Slug" }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: A page of posts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PostPage" }

  /posts:
    post:
      tags: [posts]
      summary: Publish a post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                as:
                  type: string
                  description: |
                    Publishing identity: a handle ("HanzoDev", "@HanzoDev/SonarAI")
                    or a publisher UUID. Empty publishes as the caller.
                body: { type: string, maxLength: 5000, description: Markdown }
                media_ids:
                  type: array
                  items: { type: string, format: uuid }
                  description: Media that finished uploading and belongs to the caller
      responses:
        "201":
          description: Post created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Post" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }

  /posts/{postID}:
    get:
      tags: [posts]
      summary: Read a post
      security: []
      parameters:
        - { $ref: "#/components/parameters/PostID" }
      responses:
        "200":
          description: The post
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Post" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [posts]
      summary: Edit a post
      description: Allowed for the author and for the owner of the publishing project.
      parameters:
        - { $ref: "#/components/parameters/PostID" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                body: { type: string, maxLength: 5000 }
                media_ids:
                  type: array
                  items: { type: string, format: uuid }
      responses:
        "200":
          description: Updated post
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Post" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      tags: [posts]
      summary: Soft delete a post
      parameters:
        - { $ref: "#/components/parameters/PostID" }
      responses:
        "204": { description: Post deleted }
        "403": { $ref: "#/components/responses/Forbidden" }

  /posts/{postID}/replies:
    get:
      tags: [posts]
      summary: Direct replies of a post
      security: []
      parameters:
        - { $ref: "#/components/parameters/PostID" }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: A page of replies
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PostPage" }
    post:
      tags: [posts]
      summary: Reply to a post
      parameters:
        - { $ref: "#/components/parameters/PostID" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                as: { type: string, description: Same semantics as POST /posts }
                body: { type: string, maxLength: 5000 }
                media_ids:
                  type: array
                  items: { type: string, format: uuid }
      responses:
        "201":
          description: Reply created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Post" }

  /threads/{postID}:
    get:
      tags: [threads]
      summary: Full discussion tree of a post
      security: []
      parameters:
        - { $ref: "#/components/parameters/PostID" }
      responses:
        "200":
          description: The tree, with the root post and every descendant
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Thread" }
        "404": { $ref: "#/components/responses/NotFound" }

  /media/uploads:
    post:
      tags: [media]
      summary: Reserve an upload and get presigned S3 URLs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filename, content_type, size]
              properties:
                filename: { type: string }
                content_type: { type: string, example: image/png }
                size: { type: integer, format: int64 }
      responses:
        "201":
          description: Upload slot created; PUT the bytes to upload_url, then call /media/complete
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaUpload" }
        "422": { $ref: "#/components/responses/Validation" }

  /media/complete:
    post:
      tags: [media]
      summary: Finalize an upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [media_id]
              properties:
                media_id: { type: string, format: uuid }
      responses:
        "200":
          description: Media is ready and can be attached to a post
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Media" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
      description: Opaque cursor from a previous page (next_cursor)
    PostID:
      name: postID
      in: path
      required: true
      schema: { type: string, format: uuid }
    Slug:
      name: slug
      in: path
      required: true
      schema: { type: string }

  responses:
    Unauthorized:
      description: Missing, invalid or expired credentials
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Authenticated but not allowed to perform the action
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: The resource does not exist (or was deleted)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Username, email or slug already taken
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Validation:
      description: The payload failed validation
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string, example: not_found }
            message: { type: string, example: post not found }

    Session:
      type: object
      required: [access_token, refresh_token, user]
      properties:
        access_token: { type: string, description: HS256 JWT, 15 minutes }
        refresh_token:
          type: string
          description: Opaque token, 30 days; must be rotated via /auth/refresh
        user: { $ref: "#/components/schemas/Account" }

    Account:
      type: object
      properties:
        id: { type: string, format: uuid }
        username: { type: string, example: HanzoDev }
        email: { type: string, format: email, description: Only in /me }
        display_name: { type: string }
        avatar_url: { type: string }
        bio: { type: string }
        handle: { type: string, example: "@HanzoDev" }
        created_at: { type: string, format: date-time }

    Profile:
      type: object
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        display_name: { type: string }
        avatar_url: { type: string }
        bio: { type: string }
        handle: { type: string }

    Publisher:
      type: object
      required: [id, kind, handle]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [user, project] }
        handle: { type: string, example: "@HanzoDev/SonarAI" }
        display_name: { type: string }
        avatar_url: { type: string }

    Project:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        tagline: { type: string }
        description: { type: string }
        avatar_url: { type: string }
        handle: { type: string, example: "@HanzoDev/SonarAI" }
        status: { type: string, enum: [active, archived] }
        owner:
          $ref: "#/components/schemas/Profile"
        created_at: { type: string, format: date-time }

    ProjectCreated:
      type: object
      properties:
        project: { $ref: "#/components/schemas/Project" }
        publisher: { $ref: "#/components/schemas/Publisher" }

    Media:
      type: object
      properties:
        id: { type: string, format: uuid }
        url: { type: string }
        content_type: { type: string }
        size: { type: integer, format: int64 }
        width: { type: integer }
        height: { type: integer }

    MediaUpload:
      type: object
      properties:
        media_id: { type: string, format: uuid }
        upload_url:
          type: string
          description: Presigned PUT URL; valid for a short window
        expires_at: { type: string, format: date-time }

    Post:
      type: object
      required: [id, publisher, body, created_at]
      properties:
        id: { type: string, format: uuid }
        publisher: { $ref: "#/components/schemas/Publisher" }
        body: { type: string, description: Markdown }
        media:
          type: array
          items: { $ref: "#/components/schemas/Media" }
        parent_id:
          type: [string, "null"]
          format: uuid
        root_id:
          type: [string, "null"]
          format: uuid
          description: Set on replies; the root of the discussion
        reply_count: { type: integer }
        created_at: { type: string, format: date-time }
        edited_at:
          type: [string, "null"]
          format: date-time

    PostPage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Post" }
        next_cursor:
          type: [string, "null"]
          description: Pass as cursor for the next page; null means end

    Thread:
      type: object
      properties:
        root:
          $ref: "#/components/schemas/ThreadNode"
        post_count: { type: integer }
        max_depth: { type: integer }

    ThreadNode:
      type: object
      properties:
        post: { $ref: "#/components/schemas/Post" }
        children:
          type: array
          items: { $ref: "#/components/schemas/ThreadNode" }

security:
  - bearerAuth: []
