# golangci-lint configuration (v2 schema).
# Run locally with:  golangci-lint run ./...
version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - exhaustive
    - gocritic
    - misspell
    - nolintlint
    - prealloc
    - revive
    - unconvert
    - unparam
    - whitespace
  settings:
    revive:
      rules:
        - name: exported
          disabled: true
    exhaustive:
      default-signifies-exhaustive: true
  exclusions:
    generated: lax
    rules:
      # Tests are allowed to use long functions and duplicated fixtures.
      - path: _test\.go
        linters:
          - dupl
          - funlen
          - gocritic
          - unparam

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/gtrirf/start-and-found
