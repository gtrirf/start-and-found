name: start-and-found

x-api-env: &api-env
  APP_ENV: ${APP_ENV:-development}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  HTTP_ADDR: ":8080"
  DATABASE_URL: postgres://saf:saf@postgres:5432/saf?sslmode=disable
  REDIS_URL: redis://redis:6379/0
  JWT_SECRET: ${JWT_SECRET:-dev-insecure-secret-change-me}
  ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
  REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-720h}
  S3_ENDPOINT: minio:9000
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_BUCKET: ${S3_BUCKET:-saf-media}
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:-safminio}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-safminio123}
  S3_USE_SSL: "false"
  S3_PUBLIC_BASE_URL: http://localhost:9000/${S3_BUCKET:-saf-media}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: saf
      POSTGRES_PASSWORD: saf
      POSTGRES_DB: saf
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saf -d saf"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-safminio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-safminio123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  # One-shot job: creates the media bucket, makes it publicly readable and
  # applies the browser upload CORS rules used by the web app.
  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z-cpuv1
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-safminio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-safminio123}
      S3_BUCKET: ${S3_BUCKET:-saf-media}
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\"; do sleep 2; done;
      mc mb --ignore-existing local/\"$$S3_BUCKET\";
      mc anonymous set download local/\"$$S3_BUCKET\";
      mc cors set local/\"$$S3_BUCKET\" /cors.json || echo 'cors rule skipped';
      echo 'object storage ready';
      "
    volumes:
      - ./deploy/minio/cors.json:/cors.json:ro

  api:
    profiles: ["app"]
    build:
      context: ./api
    environment:
      <<: *api-env
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    command: ["/bin/sh", "-c", "/app/migrate up && exec /app/api"]

  web:
    profiles: ["app"]
    build:
      context: ./web
    environment:
      API_BASE_URL: http://api:8080/v1
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
  redisdata:
  miniodata:
